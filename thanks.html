<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Дякуємо за реєстрацію</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .thank-you-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h1 {
            color: #ffffff;
            font-size: 22px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            margin-top: 0;
        }

        p {
            color: #f0f4f8;
            font-size: 13px;
        }

        img {
            width: 150px;
            margin-top: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<div class="thank-you-container">
    <h1>Дякуємо за реєстрацію! 🎉</h1>
    <p>Ваші дані успішно опрацьовано.</p>
    <img src="https://i.pinimg.com/736x/6b/62/7d/6b627de2c4d17aa737785890719eedd8.jpg" alt="Позитивна картинка успіху">
</div>

</body>
</html>
